# nginx.conf for the Hello example.
#
# --- How to run ---------------------------------------------------------
#   A) Docker (nothing to install):
#        docker compose up --build            # from examples/hello
#
#   B) Local OpenResty, from the repository root:
#        mkdir -p logs examples/hello/logs
#        openresty -p "$PWD" -c examples/hello/nginx.conf
#
#      Paths below are RELATIVE and resolve against `-p` (the prefix), so the
#      prefix must be the REPOSITORY ROOT -- that is where `Tilua/` lives.
#      (There is no `$prefix` variable in OpenResty's nginx; relative paths are
#      the supported way to write a prefix-independent config.)
#
#   C) Quickest for development -- generates and owns the config for you:
#        ./bin/tilua serve --root . --port 8080
#
# --- Why this shape -----------------------------------------------------
#   The two http-level blocks are master/worker boot; the four inside
#   `location /` are the per-request phases.  That split is what the framework
#   expects -- see docs/LIFECYCLE.md.

worker_processes  1;
# `daemon off` keeps nginx in the foreground so Ctrl-C stops it and a container
# exits cleanly.  `tilua serve` generates this too.
daemon     off;
error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    access_log logs/access.log;

    # Required by nginx; keep them away from the app.
    client_body_temp_path logs/client_body;
    proxy_temp_path       logs/proxy;
    fastcgi_temp_path     logs/fastcgi;
    uwsgi_temp_path       logs/uwsgi;
    scgi_temp_path        logs/scgi;

    # `./` is resolved against the prefix by OpenResty's Lua loader.
    lua_package_path "./?.lua;./?/init.lua;./examples/hello/?.lua;./examples/hello/?/init.lua;;";

    # Must match config.SHDICIT_NAME in Hello/config/dev.lua.
    lua_shared_dict hello_cache 10m;

    # ------------------------------------------------------------------
    # Master process: config + route compilation.
    # Deliberately free of filesystem/per-worker work so a broken config fails
    # `nginx -t` rather than the first request.
    # ------------------------------------------------------------------
    init_by_lua_block {
        require("Hello.app"):init_by_lua()
    }

    # ------------------------------------------------------------------
    # Worker process: view engine, middleware, plugins, warm-up.
    # ------------------------------------------------------------------
    init_worker_by_lua_block {
        require("Hello.app"):init_worker_by_lua()
    }

    server {
        listen 8080;
        server_name _;

        # Static files never enter the framework.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root examples/hello/Hello/public;
            expires 7d;
        }

        location / {
            # rewrite  -> creates the request scope; runs rewrite middleware
            rewrite_by_lua_block {
                require("Hello.app"):rewrite_by_lua()
            }

            # access   -> admission control; a denial stops the request here
            access_by_lua_block {
                require("Hello.app"):access_by_lua()
            }

            # content  -> route match, dispatch, output
            content_by_lua_block {
                require("Hello.app"):content_by_lua()
            }

            # log      -> releases the request scope (scoped services)
            log_by_lua_block {
                require("Hello.app"):log_by_lua()
            }
        }
    }
}
