<div class="site-tree">
    {% for _,nav in ipairs(navs) do %}
    <ul class="layui-tree">
        <li><h2>{{nav.title}}</h2></li>
        {% for _,item in ipairs(nav.items) do %}
        <li class="site-tree-noicon {% if item.this then %} layui-this {% end %}">
            <a href="{{item.href}}">
                <cite>{{item.title}}</cite>
                <em>{{item.em}}</em>
            </a>
        </li>
        {% end %}
    </ul>
    {% end %}

</div>
