<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>TiluaGateWay</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js" charset="utf-8"></script>

</head>
<body style="width: 500px;padding: 10px;">
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
    <legend>响应头</legend>
</fieldset>
<pre class="layui-code"  id="header-code" lay-title="响应头">
{{header}}
</pre>
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
    <legend>响应正文</legend>
</fieldset>
<pre class="layui-code" lay-title="响应正文" id="body-code">
{{body}}
</pre>
<script charset="utf-8" src="/static/layui/layui.js"></script>
<script>
    layui.use('code', function () {
        var header = JSON.parse($('<div />').html("{{header}}").text())
        $("#header-code").html(JSON.stringify(header, null, 2))
        layui.code({
            about: false
        });
    });
</script>
</body>
</html>
