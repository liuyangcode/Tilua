<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>挡板服务器</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js" charset="utf-8"></script>
    <style type="text/css">
        .layui-form-label {
        }
    </style>
</head>
<body>
<table class="layui-hide test-table" id="test" lay-filter="test"></table>
<!-- 注意：如果你直接复制所有代码到本地，上述js路径需要改成你本地的 -->
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="addService">新增路由</button>
        <button class="layui-btn layui-btn-sm" lay-event="addPlugin">新增插件</button>
    </div>
</script>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script charset="utf-8" src="/static/layui/layui.js"></script>
<script>
    layui.use(['table', 'element', 'layer'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var form = layui.form;
        table.render({
            elem: '#test'
            , url: '/routes'
            , toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
            , height: 'full-30'
            , cols: [[
                {fixed: 'left', type: 'radio'},
                {fixed: 'left', field: 'id', width: 80, title: 'ID'}
                , {
                    field: 'proxy_type', width: 120, title: '路由类型', templet: function (d) {
                        if (d.proxy_type == 'baffle') {
                            return "挡板";
                        }
                        return "反向代理";
                    }
                }
                , {field: 'protocols', width: 250, title: '匹配协议'}
                , {field: 'methods', width: 250, title: '匹配请求方法'}
                , {field: 'hosts', title: '匹配主机列表', width: 250}
                , {field: 'paths', width: 180, title: '匹配请求路径'}
                , {field: 'headers', width: 180, title: '匹配请求头'}
                , {
                    field: 'preserve_host', width: 180, title: '是否保留请求主机', templet: function (d) {
                        if (d.preserve_host == 0) {
                            return "不保留";
                        }
                        return "保留";
                    }
                }
                , {
                    field: 'strip_path', width: 180, title: '是否保留匹配前缀', templet: function (d) {
                        if (d.strip_path == 1) {
                            return "不保留";
                        }
                        return "保留";
                    }
                }, {
                    field: 'path_handle', width: 180, title: '路径处理方式', templet: function (d) {
                        if (d.path_handle == 'v0') {
                            return "追加";
                        }
                        return "连接";
                    }
                }
                , {field: 'created_at', width: 180, title: '创建时间'}
                , {field: 'updated_at', width: 180, title: '更新时间'}
                , {fixed: 'right', width: 130, align: 'center', toolbar: '#barDemo'}
            ]]
            ,id: 'test'
            , page: true
        });
        table.on('tool(test)', function (obj) {
            var data = obj.data;
            if (obj.event === 'detail') {
                layer.msg('ID：' + data.id + ' 的查看操作');
            } else if (obj.event === 'del') {
                layer.confirm('真的删除行么', function (index) {

                    $.ajax({
                        //请求方式
                        type: "delete",
                        //请求的媒体类型
                        //请求地址
                        url: "/routes/" + obj.data.id,
                        //数据，json字符串
                        //请求成功
                        success: function (result) {
                            if (result.code == 0) {
                                obj.del();
                                layer.close(index);
                            } else {
                                layer.alert(result.msg);
                            }
                        },
                        //请求失败，包含具体的错误信息
                        error: function (e) {
                            console.log(e.status);
                            console.log(e.responseText);
                        }
                    })
                });
            } else if (obj.event === 'edit') {
                layer.open({
                    type: 2,
                    title: "编辑路由",
                    area: ["540px", '580px'],
                    content: '/routes/' + data.id + '/edit'
                });
            }
        });
        //头工具栏事件
        table.on('toolbar(test)', function (obj) {
            var checkStatus = table.checkStatus(obj.config.id);
            switch (obj.event) {
                case 'addService':
                    layer.open({
                        type: 2,
                        title: "新增路由",
                        area: ["540px", '580px'],
                        content: '/routes/new'
                    });
                    break;
                case 'addPlugin':
                    if (checkStatus.data.length ==0) {
                        layer.alert("请先选择路由！")
                        return
                    }
                    layer.open({
                        type: 2,
                        title: "新增插件",
                        area: ["540px", '580px'],
                        content: '/routes/addPlugin?objecttype=route&id=' + checkStatus.data[0].id
                    });
                    break;
            }
        });
    });
</script>
</body>
</html>
