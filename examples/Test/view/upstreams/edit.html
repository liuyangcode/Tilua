<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>TiluaGateWay</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js" charset="utf-8"></script>
    <style type="text/css">
        .layui-form-label {
            width: 80px;
        }
    </style>
</head>
<body style="width: 500px;padding: 10px;">
<div id="add_form">
    <form class="layui-form">
        <input type="hidden" name="id" value="{{id}}">

        <div class="layui-form-item">
            <label class="layui-form-label">负载主机名</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" placeholder="请输入负载主机名，要与服务host一致" autocomplete="off"
                       class="layui-input" value="{{name}}">
            </div>
        </div>
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">负载算法</label>
            <div class="layui-input-block">
                <select name="algorithm">
                    <option value="least-connections" {% if algorithm=='least-connections' then  %}selected{% end %}>最小连接数法</option>
                    <option value="round-robin" {% if algorithm=='round-robin' then  %}selected{% end %}>加权轮询法</option>
                    <option value="consistent-hashing" {% if algorithm=='consistent-hashing' then  %}selected{% end %}>一致性哈希法</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">哈希数据类型</label>
            <div class="layui-input-block">
                <select name="hash_on">
                    <option value="none" {% if hash_on=='none' then  %}selected{% end %}>无</option>
                    <option value="ip" {% if hash_on=='ip' then  %}selected{% end %}>ip</option>
                    <option value="header" {% if hash_on=='header' then  %}selected{% end %}>header</option>
                    <option value="cookie" {% if hash_on=='cookie' then  %}selected{% end %}>cookie</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">请求头哈希键名</label>
            <div class="layui-input-block">
                <input type="text" name="hash_on_header"  placeholder="请输入请求头哈希键名" autocomplete="off"
                       class="layui-input" value="{{hash_on_header}}">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">Cookie哈希键名</label>
            <div class="layui-input-block">
                <input type="text" name="hash_on_cookie"  placeholder="请输入Cookie哈希键名" autocomplete="off"
                       class="layui-input"  value="{{hash_on_cookie}}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">Cookie路径</label>
            <div class="layui-input-block">
                <input type="text" name="hash_on_cookie_path"  placeholder="请输入Cookie路径" autocomplete="off"
                       class="layui-input" value="{{hash_on_cookie_path}}">
            </div>
        </div>

        <div class="layui-form-item" pane="">
            <label class="layui-form-label">备选哈希数据类型</label>
            <div class="layui-input-block">
                <select name="hash_fallback">
                    <option value="none" {% if hash_fallback=='none' then  %}selected{% end %}>无</option>
                    <option value="ip" {% if hash_fallback=='ip' then  %}selected{% end %}>ip</option>
                    <option value="header" {% if hash_fallback=='header' then  %}selected{% end %}>header</option>
                    <option value="cookie" {% if hash_fallback=='cookie' then  %}selected{% end %}>cookie</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备选请求头哈希键名</label>
            <div class="layui-input-block">
                <input type="text" name="hash_fallback_header"  placeholder="请输入备选请求头哈希键名" autocomplete="off"
                       class="layui-input"  value="{{hash_fallback_header}}">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">代理请求头Host</label>
            <div class="layui-input-block">
                <input type="text" name="host_header"  placeholder="请输入代理请求头Host" autocomplete="off"
                       class="layui-input" value="{{host_header}}">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>
</div>

<script charset="utf-8" src="/static/layui/layui.js"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form;
        //监听提交
        form.on('submit(formDemo)', function (data) {
            $.ajax({
                //请求方式
                type: "PUT",
                //请求地址
                url: "/upstreams/"+data.field.id,
                data: JSON.stringify(data.field),
                contentType: "application/json;charset=UTF-8",
                //请求成功
                success: function (result) {
                    if (result.code == 0) {
                        if (parent) {
                            var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                            parent.layer.close(index); //再执行关闭
                            parent.layui.table.reload('test')
                        }
                    } else {
                        layer.alert(JSON.stringify(result));
                    }
                },
                //请求失败，包含具体的错误信息
                error: function (e) {
                    console.log(e.status);
                    console.log(e.responseText);
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
