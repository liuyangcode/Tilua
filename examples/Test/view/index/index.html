<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>TiluaGateWay</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo">TiluaGateWay</div>
    </div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="test">
                {% for _,m in ipairs(menu) do %}
                <li class="layui-nav-item{% if tag== m.tag then %} layui-nav-itemed{% end %}">
                    <a href="#">{{m.title}}</a>
                    {% for _,item in ipairs(m.items) do %}
                    <dl class="layui-nav-child">
                        <dd class="{% if string.sub(item.link,7)==url then %}layui-this{% end %}">
                            <a href="{{item.link}}&tag={{m.tag}}">{{item.title}}</a>
                        </dd>
                    </dl>
                    {% end %}
                </li>
                {% end %}
            </ul>
        </div>
    </div>

    <div class="layui-body" style="padding: 10px">
        <span class="layui-breadcrumb">
          <a href="/">首页</a>
        </span>
        <iframe frameborder="0" id="demoAdmin" src="{{url}}" style="width: 100%; height: 96%"></iframe>
    </div>

    <div class="layui-footer">
        <!-- 底部固定区域 -->
        © T-GateWay - By www.Tilua.cn
    </div>
</div>
<script src="/static/layui/layui.js"></script>
<script>
    //JavaScript代码区域
    layui.use('element', function () {
    });
</script>
</body>
</html>
