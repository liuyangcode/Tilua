<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>TiluaGateWay</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js" charset="utf-8"></script>
    <style type="text/css">
        .layui-form-label {
            width: 120px;
        }

        .layui-input-inline {
            width: 300px;
        }

        .layui-input-block {
            margin-left: 150px;
        }
    </style>
</head>
<body style="width: 500px;padding: 10px;">
<div id="add_form">
    <form class="layui-form">
        <input name="objectid" type="hidden" value="{{id}}">
        <input name="objecttype" type="hidden" value="{{objecttype}}">

        <div class="layui-form-item">
            <label class="layui-form-label">选择插件</label>
            <div class="layui-input-block">
                <select name="mid" lay-verify="" lay-search>
                    {% for _, plugin in ipairs(plugins) do %}
                    <option value="{{plugin.id}}">{{plugin.name}}</option>
                    {% end %}
                </select>
            </div>
        </div>

        <div class="layui-form-item" pane="">
            <label class="layui-form-label">执行阶段</label>
            <div class="layui-input-block">
                <select name="phase">
                    <option value="rewrite">URL重写</option>
                    <option value="access">请求准入时</option>
                    <option value="content">请求处理前</option>
                    <option value="headfilter">响应头部过滤处理</option>
                    <option value="bodyfilter">响应体过滤处理</option>
                    <option value="request_end">会话结束前</option>
                    <option value="log">会话结束后</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">配置项</label>
            <div class="layui-input-block">
                <div class="layui-input-inline" style="width: 300px">
                </div>
                <div class="layui-form-mid layui-word-aux">
                    <button type="button" class="layui-btn layui-btn-sm" onclick="addPath(this,'config')"><i
                            class="layui-icon layui-icon-addition"></i></button>
                    <button type="button" class="layui-btn layui-btn-sm" onclick="removePath(this)"><i
                            class="layui-icon layui-icon-subtraction"></i></button>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>
</div>

<script charset="utf-8" src="/static/layui/layui.js"></script>
<script>
    function removePath(item) {
        $(item).parent().prev().children().last().remove();
    }
    function addPath(item, field, value) {
        $(item).parent().prev().append("<input type=\"text\" value='" + (value || "") + "' name=\"" + field + "\"  autocomplete=\"off\" class=\"layui-input\" style='margin-top: 10px'>\n");
    }
    layui.use(['form'], function () {
        var form = layui.form;
        //监听提交
        form.on('submit(formDemo)', function (data) {
            //alert($('form').serialize())
            $.ajax({
                //请求方式
                type: "POST",
                //请求的媒体类型
                //contentType: "application/json;charset=UTF-8",
                //请求地址
                url: "/plugins/add/{{objecttype}}/{{id}}",
                //数据，json字符串
                data: $('form').serialize(),//JSON.stringify(data.field),
                //请求成功
                success: function (result) {
                    if (result.code == 0) {
                        if (parent) {
                            var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                            parent.layer.close(index); //再执行关闭
                            parent.layui.table.reload('test')

                        }
                    } else {
                        layer.alert(result.msg);
                    }
                },
                //请求失败，包含具体的错误信息
                error: function (e) {
                    console.log(e.status);
                    console.log(e.responseText);
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
