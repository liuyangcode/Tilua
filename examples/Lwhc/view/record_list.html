<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>核查浏览</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
    <script src="/static/js/jquery.min.js" charset="utf-8"></script>
    <style type="text/css">
        .layui-form-label {
        }
    </style>
</head>
<body>
<table class="layui-hide test-table" id="test" lay-filter="test"></table>
<!-- 注意：如果你直接复制所有代码到本地，上述js路径需要改成你本地的 -->
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="search">查询</button>
    </div>
</script>
<div id="searchform" style="padding: 20px;display: none">
    <form class="layui-form " action="" method="post">
        <div class="layui-form-item">
            <label class="layui-form-label">客户姓名</label>
            <div class="layui-input-block">
                <input type="text" name="certName"
                       placeholder="请输入客户姓名"
                       autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">身份证号码</label>
            <div class="layui-input-block">
                <input type="text" name="certNo"
                       placeholder="请输入身份证号码"
                       autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">核查日期起</label>
            <div class="layui-input-block">
                <input type="text" name="start"
                       placeholder="请输入核查日期始，格式如2020-01-01"
                       autocomplete="off" class="layui-input" lay-verify="date" id='start'>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">核查日期止</label>
            <div class="layui-input-block">
                <input type="text" name="end"
                       placeholder="请输入核查日期止，格式如2020-01-01"
                       autocomplete="off" class="layui-input" lay-verify="date" id='end'>
            </div>
        </div>
    </form>
</div>
<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="view">查看影像资料</a>
</script>

<script charset="utf-8" src="/static/layui/layui.js"></script>
<script>
    layui.use(['table', 'element', 'layer', 'form', 'laydate'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        laydate.render({
            elem: '#start'
        });
        laydate.render({
            elem: '#end'
        });
        table.render({
            elem: '#test'
            , url: '/record/index/{% if history ==0 then %}record{% else %}record_history{% end %}'
            , toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
            , height: 'full-30'
            , cols: [[
                {fixed: 'left', field: 'recordid', width: 120, title: 'ID'}

                , {
                    field: 'typeid', width: 150, title: '业务类型', templet: function (d) {
                        return "开户";
                    }
                }
                , {field: 'certName', width: 150, title: '姓名'}
                , {field: 'certNo', width: 250, title: '主机'}
                , {field: 'rtime', width: 250, title: '核查时间'}
                , {
                    field: 'result', width: 250, title: '核查结果', templet: function (d) {
                        return {
                            '00': '[00] 号码与姓名一致且照片存在',
                            '01': '[01] 号码与姓名一致且照片不存在',
                            '02': '[02] 号码存在但与姓名不一致',
                            '03': '[03] 号码不存在'
                        }[d.result] || '网络繁忙，查询失败，稍后再试...'
                    }
                }
                , {
                    field: 'success', width: 80, title: '状态', templet: function (d) {
                        if (d.success == 1) return '成功';
                        return "失败";
                    }
                }

                , {fixed: 'right', width: 130, align: 'center', toolbar: '#barDemo'}
            ]]
            , page: true
            , id: 'recordlist'
        });
        table.on('tool(test)', function (obj) {
            var data = obj.data;
            if (obj.event === 'view') {
                window.open('/record/view/' + data.certNo + '/' + data.recordid, '_blank')
            } else if (obj.event === 'del') {
            } else if (obj.event === 'edit') {

            }
        });
        //头工具栏事件
        table.on('toolbar(test)', function (obj) {
            var checkStatus = table.checkStatus(obj.config.id);
            switch (obj.event) {
                case 'search':
                    $('form')[0].reset()
                    layer.open({
                        type: 1,
                        title: "查询",
                        btnAlign: 'c',
                        area: ['500px', '350px'],
                        content: $('#searchform')
                        , btn: ['提交查询'],
                        yes: function (index, layero) {
                            var d = {};
                            var t = $('form').serializeArray();
                            $.each(t, function () {
                                d[this.name] = this.value;
                            });
                            table.reload('recordlist', {
                                where: d
                            })
                            layer.close(layer.index);
                        }
                    });
                    break;
            }
        });
    });
</script>
</body>
</html>
