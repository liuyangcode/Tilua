<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport">
    <title>联网核查用户注册</title>
    <link href="/static/layui/css/layui.css" rel="stylesheet">
</head>
<style type="text/css">
    body {
        padding: 50px;
    }

</style>
<body>
<h1 class="site-h1" style="text-align: center">用户注册</h1>
<fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
    <legend>用户信息</legend>
</fieldset>
<form class="layui-form" action="/user/create" method="post">
    {*__CSRF__*}
    <div class="layui-form-item">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-block">
            <input type="text" name="uname" lay-verify="username" autocomplete="off"
                   placeholder="请输入用户名，用户名由字母和数字组成，长度为4-8位,不区分大小写" class="layui-input" lay-reqtext="用户名是必填项，岂能为空？">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
            <input type="password" name="upwd" lay-verify="pass" placeholder="请输入密码，密码由字母和数字组成，长度为6-10位,区分大小写"
                   autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码确认</label>
        <div class="layui-input-block">
            <input type="password" name="passwordconfirm" lay-verify="pass" placeholder="请再次输入密码" autocomplete="off"
                   class="layui-input">
        </div>
    </div>
    <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
        <legend>联网核查账户信息</legend>
    </fieldset>
    <div class="layui-form-item">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-block">
            <input type="text" name="lwhc_uname" lay-verify="required" autocomplete="off" placeholder="请输入原联网核查账户名"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
            <input type="text" name="lwhc_upwd" lay-verify="required" autocomplete="off" placeholder="请输入原联网核查账户密码"
                   class="layui-input">
        </div>
    </div>
    <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
        <legend>基本信息</legend>
    </fieldset>
    <div class="layui-form-item">
        <label class="layui-form-label">姓名</label>
        <div class="layui-input-block">
            <input type="text" name="name" lay-verify="required" autocomplete="off" placeholder="请输入姓名"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">操作号</label>
        <div class="layui-input-block">
            <input type="text" name="operNo" lay-verify="operNo" autocomplete="off" placeholder="请输入4位操作号，如不足四位，前面补0."
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">所在支行</label>
        <div class="layui-input-block">
            <select name="jgm" lay-verify="required">
                {% for _,v in ipairs(jgma) do %}
                <option value="{{v.jgma}}">{{v.jgma}}-{{v.jgmc}}</option>
                {% end %}
            </select>
        </div>
    </div>
    <div class="layui-form-item" style="text-align: center">
        <button type="submit" class="layui-btn layui-btn-lg " lay-submit="" lay-filter="demo1">注册</button>
        <button type="reset" class="layui-btn layui-btn-primary  layui-btn-lg ">重置</button>
    </div>
</form>
<script src="/static/layui/layui.js"></script>
<script>
    //JavaScript代码区域
    layui.use('form', function () {
        var form = layui.form
            , layer = layui.layer;
        //自定义验证规则
        form.verify({
            username: [
                /^[a-zA-Z][a-zA-Z0-9]{3,7}$/,
                '用户名由字母和数字组成，长度为4-8位,不区分大小写'
            ]
            , pass: [
                /^[a-zA-Z0-9]{6,10}$/
                , '密码必须6到12位，且不能出现空格'
            ],
            operNo: [
                /^[0-9]{4,5}$/,
                '请输入4位操作号，如不足四位，前面补0'
            ]
        });
        //监听提交
        form.on('submit(demo1)', function (data) {
            if (data.field.upwd != data.field.passwordconfirm) {
                layer.alert('两次输入密码不一致，请重新输入！', {
                    title: '提示'
                })
                return false
            }
            layer.alert(JSON.stringify(data.field), {
                title: '最终的提交信息'
            })
            return true;
        });
    });
</script>
</body>
</html>
