# nginx.conf for the Api example.
#
# --- How to run ---------------------------------------------------------
#   A) Docker (nothing to install):
#        docker compose up --build            # from examples/api
#
#   B) Local OpenResty, from the repository root:
#        mkdir -p logs examples/api/logs
#        openresty -p "$PWD" -c examples/api/nginx.conf
#
#      Paths are RELATIVE and resolved against `-p` (the prefix), so the prefix
#      must be the REPOSITORY ROOT -- that is where `Tilua/` lives.  OpenResty's
#      nginx has no `$prefix` variable.
#
#   C) Development, config generated for you:
#        ./bin/tilua serve --root . --port 8081
#
# See examples/hello/nginx.conf for the annotated version of the phase wiring.

worker_processes  1;
# `daemon off` keeps nginx in the foreground so Ctrl-C stops it and a container
# exits cleanly.
daemon     off;
error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    access_log logs/access.log;

    client_body_temp_path logs/client_body;
    proxy_temp_path       logs/proxy;
    fastcgi_temp_path     logs/fastcgi;
    uwsgi_temp_path       logs/uwsgi;
    scgi_temp_path        logs/scgi;

    lua_package_path "./?.lua;./?/init.lua;./examples/api/?.lua;./examples/api/?/init.lua;;";

    # Must match config.SHDICIT_NAME in Api/config/dev.lua.
    lua_shared_dict api_cache 10m;

    # Master process: config + routes.
    init_by_lua_block {
        require("Api.app"):init_by_lua()
    }

    # Worker process: view engine, middleware, plugins.
    init_worker_by_lua_block {
        require("Api.app"):init_worker_by_lua()
    }

    server {
        listen 8081;
        server_name _;

        location / {
            rewrite_by_lua_block {
                require("Api.app"):rewrite_by_lua()
            }
            access_by_lua_block {
                require("Api.app"):access_by_lua()
            }
            content_by_lua_block {
                require("Api.app"):content_by_lua()
            }
            log_by_lua_block {
                require("Api.app"):log_by_lua()
            }
        }
    }
}
