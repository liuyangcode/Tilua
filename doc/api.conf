lua_package_path '$prefix/../lua/?.lua;$prefix/../lualib/?.lua;$prefix/../lualib/Tilua/support/?.lua;';
lua_package_cpath '$prefix/../lualib/?.so;/usr/local/lib/lua/5.1/?.so;$prefix/../lualib/Tilua/support/?.so;';

lua_shared_dict events 10m;
lua_shared_dict service_cache 10m;
lua_shared_dict route_cache 10m;

lua_code_cache off;

init_by_lua_block {
       ApiGateWay = require 'ApiGateWay.app'
       ApiGateWay:startup()
       ApiDocApp = require 'ApiDoc.app'
       ApiDocApp:startup()
       TestApp = require 'Test.app'
       TestApp:startup()
}

init_worker_by_lua_block {
      ApiGateWay:init_worker()
      TestApp:init_worker()
}

upstream backend {
    server 0.0.0.1;
    balancer_by_lua_block {
        ApiGateWay.balancer()
    }
    keepalive_requests 100;
    keepalive 60;
    keepalive_timeout 60;
}


server {
        listen 80;
        listen 443 ssl;

        ssl_certificate     ../cert/server-root.crt;
        ssl_certificate_key ../cert/server.key;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout  5m;

        ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
        #SSLv2 SSLv3 TLSv1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

        #ssl_ciphers  ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        ssl_prefer_server_ciphers   on;


        ssl_certificate_by_lua_block {
            ApiGateWay.ssl_certificate()
        }

        location / {
                rewrite_by_lua_block        {
                    ApiGateWay:rewrite()
                }
                access_by_lua_block        {
                    ApiGateWay:access()
                }
                header_filter_by_lua_block {
                    ApiGateWay.header_filter()
                }
                body_filter_by_lua_block   {
                    ApiGateWay.body_filter()
                }
                log_by_lua_block           {
                    ApiGateWay:log()
                }

                location / {
                    set $upstream_host              '';
                    set $upstream_upgrade           '';
                    set $upstream_connection        '';
                    set $upstream_scheme            '';
                    set $upstream_uri               '';
                    set $upstream_x_forwarded_for   '';
                    set $upstream_x_forwarded_proto '';
                    set $upstream_x_forwarded_host  '';
                    set $upstream_x_forwarded_port  '';
                    proxy_http_version    1.1;
                    proxy_set_header      Host              $upstream_host;
                    proxy_set_header      Upgrade           $upstream_upgrade;
                    proxy_set_header      Connection        $upstream_connection;
                    proxy_set_header      X-Forwarded-For   $upstream_x_forwarded_for;
                    proxy_set_header      X-Forwarded-Proto $upstream_x_forwarded_proto;
                    proxy_set_header      X-Forwarded-Host  $upstream_x_forwarded_host;
                    proxy_set_header      X-Forwarded-Port  $upstream_x_forwarded_port;
                    proxy_set_header      X-Real-IP         $remote_addr;
                    proxy_pass_header     Server;
                    proxy_pass_header     Date;
                    proxy_pass            $upstream_scheme://backend$upstream_uri;
                }
        }
}

server {
        listen 8002;
        location ~/.*\.(ttf|rar|css|js|jpg|jpeg|png|gif|ico|woff|woff2|eot|svg|css\.map|min\.map|docx|xlsx|cab|apk).*$ {
                root /usr/local/openresty/lua/ApiDoc/;
                add_header Access-Control-Allow-Origin *;
                keepalive_timeout  0;
                expires 7d;
        }
        location / {
                access_by_lua_block        {
                    ApiDocApp:init()
                }
                content_by_lua_block {
                    ApiDocApp.run()
                }
                log_by_lua_block           {
                    ApiDocApp.request_end()
                }
        }
}

server {
        listen 8001;
        location ~/.*\.(ttf|rar|css|js|jpg|jpeg|png|gif|ico|woff|woff2|eot|svg|css\.map|min\.map|docx|xlsx|cab|apk).*$ {
                root /usr/local/openresty/lua/Test/;
                add_header Access-Control-Allow-Origin *;
                keepalive_timeout  0;
                expires 7d;
        }
        location / {
                access_by_lua_block        {
                    TestApp:init()
                }
                content_by_lua_block {
                    TestApp.run()
                }
                header_filter_by_lua_block {
                    TestApp.header_filter()
                }
                body_filter_by_lua_block   {
                    TestApp.body_filter()
                }
                log_by_lua_block           {
                    TestApp.request_end()
                }
        }
}
