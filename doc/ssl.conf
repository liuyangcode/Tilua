server {
    listen       443 ssl;

    server_name  32.254.48.94;
    server_tokens off;
    ssl                  on;
  # ssl_certificate      /usr/local/nginx/cert/shyrcb.crt;
   # ssl_certificate_key  /usr/local/nginx/cert/shyrcb.rsa;
    ssl_certificate      ../cert/server-root.crt;
    ssl_certificate_key  ../cert/server.key;
#    ssl_client_certificate /usr/local/nginx-1.10.3/cert/ca.crt;
    #ssl_verify_client on;
    ssl_session_timeout  5m;

    ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
    #SSLv2 SSLv3 TLSv1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

    #ssl_ciphers  ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_prefer_server_ciphers   on;

    location / {
    	proxy_redirect off;
     	proxy_set_header Host $host;
     	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     	proxy_pass http://127.0.0.1:8000;
     }
}

