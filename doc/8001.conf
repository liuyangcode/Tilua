lua_package_path '$prefix/../lua/?.lua;$prefix/../lualib/?.lua;;';
lua_shared_dict app_test_cache 10m;
lua_code_cache off;
init_by_lua_block {
       TestApp = require 'Test.app'
       TestApp:startup()
}
init_worker_by_lua_block {
      TestApp.init_worker()
}
server {
        listen 8001;
        location ~/.*\.(ttf|rar|css|js|jpg|jpeg|png|gif|ico|woff|woff2|eot|svg|css\.map|min\.map|docx|xlsx|cab|apk).*$ {
                root /usr/local/openresty/lua/Test/;
                add_header Access-Control-Allow-Origin *;
                keepalive_timeout  0;
                expires 7d;
        }
        location / {
                access_by_lua_block        {
                    TestApp:init()
                }
                content_by_lua_block {
                    TestApp.run()
                }
                header_filter_by_lua_block {
                    TestApp.header_filter()
                }
                body_filter_by_lua_block   {
                    TestApp.body_filter()
                }
                log_by_lua_block           {
                    TestApp.request_end()
                }
        }
}
