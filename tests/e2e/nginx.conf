worker_processes 1;
error_log /app/.e2e/error.log info;
pid /app/.e2e/nginx.pid;
daemon off;

events { worker_connections 128; }

http {
    access_log /app/.e2e/access.log;
    # warn so our phase traces are visible without debug noise
    error_log /app/.e2e/error.log warn;
    client_body_temp_path /app/.e2e/client_body;
    proxy_temp_path /app/.e2e/proxy;
    fastcgi_temp_path /app/.e2e/fastcgi;
    uwsgi_temp_path /app/.e2e/uwsgi;
    scgi_temp_path /app/.e2e/scgi;

    lua_package_path "/app/tests/e2e/lua/?.lua;/app/tests/e2e/lua/?/init.lua;/app/?.lua;/app/?/init.lua;/app/tests/fixtures/?.lua;/app/tests/fixtures/?/init.lua;;";
    lua_shared_dict app_test_cache 1m;

    server {
        listen 8100;

        location = /_lfsprobe {
            content_by_lua_block {
                local out = {}
                local function add(k, v) out[#out+1] = k .. " = " .. tostring(v) end
                local ok, err = pcall(function()
                    local lfs = require("lfs")
                    local dir = "/app/tests/fixtures/TestApp/cache/view/"
                    add("lfs.attributes(dir)", lfs.attributes(dir, "mode"))
                    add("lfs.attributes(file)", lfs.attributes("/app/Tilua/app.lua", "mode"))
                    add("lfs.attributes(missing)", lfs.attributes("/nope/x", "mode"))
                    add("os.execute", os.execute("mkdir -p /tmp/zzz2"))
                    local path = require("Tilua.utils.path")
                    add("path.isdir(dir)", path.isdir(dir))
                    add("path.isdir(file)", path.isdir("/app/Tilua/app.lua"))
                    add("path.exists(dir)", path.exists(dir))
                    add("path.dirname", path.dirname(dir))
                end, function(e) return tostring(e) .. "\n" .. debug.traceback("", 2) end)
                if not ok then
                    add("ERROR", err)
                end
                ngx.say(table.concat(out, "\n"))
            }
        }

        location = /_routes {
            content_by_lua_block {
                local App = require("TestApp.app")
                local out = {}
                local router = App:make("router")
                local function add(s) out[#out+1] = s end
                add("cur_app = " .. tostring(router.cur_app))
                add("rules:")
                for k in pairs(router.rules[router.cur_app] or {}) do
                    add("  " .. tostring(k))
                end
                local caches = router.get_route_caches("TestApp") or {}
                add("rule_caches = " .. tostring(#caches))
                for i, r in ipairs(caches) do
                    add(string.format("  [%d] matcher=%s path=%s regex=%s args=%s",
                        i, tostring(r.matcher), tostring(r.path),
                        tostring(r.regex), tostring(r.args)))
                end

                add("--- select_best_match ---")
                for _, p in ipairs({ "/greeter", "/text", "/about", "/user/ada", "/nope" }) do
                    local cand = router.find_matched_route("TestApp", "get", p)
                    local best = router.select_best_match(App, cand)
                    add(string.format("%-12s candidates=%d best=%s", p, #cand,
                        best and tostring(best.path) or "nil"))
                end
                ngx.say(table.concat(out, "\n"))
            }
        }

        location / {
            rewrite_by_lua_block {
                local ok, err = pcall(function()
                    require("TestApp.app"):rewrite_by_lua()
                end)
                if not ok then
                    ngx.log(ngx.ERR, "[e2e] rewrite_by_lua failed: ", tostring(err))
                    ngx.status = 599
                    ngx.say("REWRITE ERROR: ", tostring(err))
                    return ngx.exit(599)
                end
            }
            access_by_lua_block {
                local ok, err = pcall(function()
                    require("TestApp.app"):access_by_lua()
                end)
                if not ok then
                    ngx.log(ngx.ERR, "[e2e] access_by_lua failed: ", tostring(err))
                    ngx.status = 598
                    ngx.say("ACCESS ERROR: ", tostring(err))
                    return ngx.exit(598)
                end
            }
            content_by_lua_block {
                local ok, err = pcall(function()
                    require("TestApp.app"):content_by_lua()
                end)
                if not ok then
                    ngx.log(ngx.ERR, "[e2e] content_by_lua failed: ", tostring(err))
                    ngx.status = 597
                    ngx.say("CONTENT ERROR: ", tostring(err))
                    return ngx.exit(597)
                end
            }
            log_by_lua_block {
                pcall(function()
                    require("TestApp.app"):log_by_lua()
                end)
            }
        }
    }

    init_by_lua_block {
        require("TestApp.app"):init_by_lua()
    }

    init_worker_by_lua_block {
        require("TestApp.app"):init_worker_by_lua()
    }
}
